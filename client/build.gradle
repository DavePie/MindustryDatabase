buildscript {
    dependencies {
        classpath(libs.postgresql)
    }
}

plugins {
    id 'java-library'
    alias(libs.plugins.jooqCodegen)
}

group = 'net.ddns.mindustry.database.client'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {

    implementation libs.postgresql
    implementation libs.jooq
    implementation libs.argon2
    implementation libs.jna // For some reason gradle cannot resolve this dependency for argon2, so I added it manually.

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

java {
    // If you think this Java version is too high for a library, I don't care, update your software.
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Includes JOOQ sources into the client.
sourceSets.main.java.srcDirs += "build/generated-sources"

def dbProps = new Properties()
file("jooq.properties").withInputStream { stream ->
    dbProps.load(stream)
}

jooq {
    configuration {
        jdbc {
            driver   = "org.postgresql.Driver"
            url      = dbProps.getProperty('url')
            user     = dbProps.getProperty('user')
            password = dbProps.getProperty('password')
        }
        generator {
            database {

                name = "org.jooq.meta.postgres.PostgresDatabase"

                // All elements that are generated from your schema (A Java regular expression.
                // Use the pipe to separate several expressions) Watch out for
                // case-sensitivity. Depending on your database, this might be
                // important!
                //
                // You can create case-insensitive regular expressions using this syntax: (?i:expr)
                //
                // Whitespace is ignored and comments are possible.
                includes = ".*"

                // All elements that are excluded from your schema (A Java regular expression.
                // Use the pipe to separate several expressions). Excludes match before
                // includes, i.e. excludes have a higher priority
                excludes = """
                           UNUSED_TABLE                   # This table (unqualified name) should not be generated
                           | PREFIX_.*                    # Objects with a given prefix should not be generated
                           | SECRET_SCHEMA\\.SECRET_TABLE # This table (qualified name) should not be generated
                           | SECRET_ROUTINE               # This routine (unqualified name) ...
                           """
                // The schema that is used locally as a source for meta information.
                // This could be your development schema or the production schema, etc
                // This cannot be combined with the schemata element.
                //
                // If left empty, jOOQ will generate all available schemata. See the
                // manual's next section to learn how to generate several schemata
                inputSchema = "public"
            }

            // Generation flags: See advanced configuration properties
            generate {
                pojos = true
                pojosAsJavaRecordClasses = true
            }
            target {
                packageName = "net.ddns.mindustry.database.schema"
                directory = "build/generated-sources/jooq"
            }
        }
    }
}
