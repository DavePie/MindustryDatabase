apply plugin: "java"
apply plugin: 'kotlin'
apply plugin: 'maven-publish'

group = 'com.github.BnDLett'
version '1.0'

sourceSets.main.java.srcDirs = ["src"]

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

repositories{
    mavenCentral()
    maven{ url "https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository" }
    maven{ url 'https://www.jitpack.io' }
}

ext{
    //the build number that this plugin is made for
    mindustryVersion = 'v145'
    jabelVersion = "93fde537c7"
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


dependencies{
    compileOnly "com.github.Anuken.Arc:arc-core:$mindustryVersion"
    compileOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"
    annotationProcessor "com.github.Anuken:jabel:$jabelVersion"
//    implementation 'org.xerial:sqlite-jdbc:3.30.1'
    implementation project(':client')

    compileOnly 'com.github.mindustry-ddns-net:segment:development-SNAPSHOT'

    implementation libs.jooq
    implementation libs.jooqPostgresqlExtension
}

jar{
    dependsOn("client:jar")

    archiveFileName = "${project.archivesBaseName}.jar"
    from{
        configurations.runtimeClasspath.collect{it.isDirectory() ? it : zipTree(it)}
    }

    from(rootDir){
        include "plugin.json"
    }
}

java {
    withSourcesJar()
    withJavadocJar()
}

// asdf
publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'net.ddns.mindustry'
            artifactId = 'MindustryDatabase'
            version = '1.1'

            from components.java
        }
    }
}

wrapper {
    gradleVersion = "7.3.3"
    distributionType = Wrapper.DistributionType.ALL
}
buildscript {
    ext.kotlin_version = '2.1.10'
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}
kotlin {
    jvmToolchain(21)
}
