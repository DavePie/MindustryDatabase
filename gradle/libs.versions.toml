[versions]
jooq         = "3.19.18"
postgresql   = "42.7.5"
argon2       = "2.11"
jna          = "5.16.0"
jspecify     = "1.0.0"
sqids        = "0.1.0"
extra-module = "1.12"
hikariCP     = "7.0.2"

[plugins]
jooqCodegen  = { id = "org.jooq.jooq-codegen-gradle"      , version.ref = "jooq"}
extra-module = { id = "org.gradlex.extra-java-module-info", version.ref = "extra-module"}

[libraries]
jooq       = { module = "org.jooq:jooq"                    , version.ref = "jooq" }
postgresql = { module = "org.postgresql:postgresql"        , version.ref = "postgresql" }
jooqExt    = { module = "org.jooq:jooq-postgres-extensions", version.ref = "jooq" }
argon2     = { module = "de.mkammerer:argon2-jvm"          , version.ref = "argon2" }
jna        = { module = "net.java.dev.jna:jna"             , version.ref = "jna" }
jspecify   = { module = "org.jspecify:jspecify"            , version.ref = "jspecify" }
sqids      = { module = "org.sqids:sqids"                  , version.ref = "sqids" }
hikariCP   = { module = "com.zaxxer:HikariCP"              , version.ref = "hikariCP" }